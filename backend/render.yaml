# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → chọn repo, root có file này hoặc chỉnh Root Directory = backend

services:
  - type: web
    name: mentorai-grad-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Thêm trên Dashboard sau khi có DB + Vercel URL:
      # PORT (Render tự gán), DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME
      # JWT_SECRET, JWT_EXPIRE, FRONTEND_URL, GEMINI_API_KEY
